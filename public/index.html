<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Threads AI Publisher</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <main class="container">

        <h1>🧵 Threads AI Publisher</h1>

        <p class="subtitle">
            Publica directamente en tu cuenta de Threads
        </p>

        <textarea
            id="postText"
            maxlength="500"
            placeholder="Escribe tu publicación..."
        ></textarea>

        <div class="counter">
            <span id="counter">0</span> / 500
        </div>

        <button id="publishButton">
            Publicar en Threads
        </button>

        <div id="status"></div>

    </main>

    <script src="app.js"></script>

</body>

</html>
